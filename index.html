<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle do Campo Minado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: uma coluna de leitura; cada parte e uma ficha numerada como uma casa do tabuleiro. */
:root {
  --chao: #e9ecf1;
  --papel: #f7f8fa;
  --tinta: #1b2130;
  --tinta-2: #4d5568;
  --linha: #cdd3dd;
  --casa: #c3c9d3;
  --casa-luz: #f2f4f7;
  --casa-sombra: #8b93a1;
  --codigo-fundo: #1d2230;
  --codigo-tinta: #dfe4ee;
  --bandeira: #c8372d;
  --feita: #2f7d3b;
  --andamento: #b26a00;
  --n1: #1f4fd1; --n2: #237a2e; --n3: #c62828; --n4: #1a237e; --n5: #7b1f1f; --n6: #00838f;
  --h-mnem: #8fb7ff; --h-reg: #f2c37a; --h-num: #b9e28c; --h-str: #f0a3b5; --h-com: #8a93a6; --h-rot: #ffffff; --h-dir: #c9a6ff;
  --f-titulo: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --f-texto: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-codigo: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --chao: #151923;
    --papel: #1c212d;
    --tinta: #e6e9f0;
    --tinta-2: #a3abbc;
    --linha: #2e3545;
    --casa: #3a4254;
    --casa-luz: #56607a;
    --casa-sombra: #1a1f2a;
    --codigo-fundo: #10141d;
    --bandeira: #ff6b5e;
    --feita: #5ccf6e;
    --andamento: #f0a43a;
    --n1: #7aa2ff; --n2: #6fd07d; --n3: #ff7a70; --n4: #9fa8ff; --n5: #e08a8a; --n6: #4fd3df;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { background: var(--chao); }
body {
  margin: 0;
  background: var(--chao);
  color: var(--tinta);
  font: 15px/1.55 var(--f-texto);
  padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pagina { max-width: 880px; margin: 0 auto; display: grid; gap: 28px; }

header { display: grid; gap: 14px; }
h1 {
  font: 800 clamp(30px, 6vw, 46px)/1.05 var(--f-titulo);
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.sub { color: var(--tinta-2); margin: 0; max-width: 62ch; }
.sub code, .onde code, .resumo code { font: 500 0.88em var(--f-codigo); background: var(--papel); border: 1px solid var(--linha); border-radius: 4px; padding: 0 4px; }

.tabuleiro { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tabuleiro .contagem { margin-left: 8px; color: var(--tinta-2); font-variant-numeric: tabular-nums; }

.casa {
  --cor: var(--tinta);
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  font: 800 18px/1 var(--f-titulo);
  color: var(--cor);
  background: var(--casa);
  border-radius: 3px;
  box-shadow: inset 2px 2px 0 var(--casa-luz), inset -2px -2px 0 var(--casa-sombra);
  text-decoration: none;
}
.casa.aberta { background: var(--papel); box-shadow: inset 0 0 0 1px var(--linha); }
.casa[data-n="1"] { --cor: var(--n1); } .casa[data-n="2"] { --cor: var(--n2); } .casa[data-n="3"] { --cor: var(--n3); }
.casa[data-n="4"] { --cor: var(--n4); } .casa[data-n="5"] { --cor: var(--n5); } .casa[data-n="6"] { --cor: var(--n6); }
.casa.grande { width: 46px; height: 46px; font-size: 24px; }

.como {
  display: grid; gap: 6px;
  background: var(--papel);
  border: 1px solid var(--linha);
  border-radius: 8px;
  padding: 14px 16px;
}
.como p { margin: 0; }
.erro-status { color: var(--bandeira); }

.parte {
  background: var(--papel);
  border: 1px solid var(--linha);
  border-radius: 10px;
  padding: 20px;
  display: grid; gap: 16px;
  scroll-margin-top: 16px;
  min-width: 0;
}
.parte-topo { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.parte-topo h2 { font: 700 22px/1.2 var(--f-titulo); margin: 0; flex: 1 1 200px; min-width: 0; }
.resumo { margin: 0; max-width: 68ch; }

.selo {
  display: inline-flex; align-items: center; gap: 6px;
  font: 600 12px/1 var(--f-texto);
  letter-spacing: 0.04em; text-transform: uppercase;
  padding: 6px 10px; border-radius: 999px;
  border: 1px solid var(--linha); color: var(--tinta-2);
  white-space: nowrap;
}
.selo::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.selo.feita { color: var(--feita); border-color: color-mix(in srgb, var(--feita) 40%, transparent); }
.selo.andamento { color: var(--andamento); border-color: color-mix(in srgb, var(--andamento) 40%, transparent); }
.selo.livre { color: var(--tinta-2); }

.linha-meta { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; color: var(--tinta-2); font-size: 14px; }
.deps { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.deps .casa { width: 24px; height: 24px; font-size: 13px; }
a { color: var(--n1); }
.issue-link { font-weight: 600; }

.edicao { display: grid; gap: 6px; min-width: 0; }
.onde { font-weight: 600; font-size: 14px; }
.bloco { position: relative; min-width: 0; }
pre {
  margin: 0;
  background: var(--codigo-fundo);
  color: var(--codigo-tinta);
  border-radius: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  font: 13.5px/1.55 var(--f-codigo);
  tab-size: 4;
}
.copiar {
  position: absolute; top: 8px; right: 8px;
  font: 600 12px/1 var(--f-texto);
  padding: 7px 10px; border-radius: 6px;
  border: 1px solid #3a4256; background: #262c3b; color: #dfe4ee;
  cursor: pointer;
}
.copiar:hover { background: #313849; }
.copiar:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--n1); outline-offset: 2px; }
.t-mnem { color: var(--h-mnem); } .t-reg { color: var(--h-reg); } .t-num { color: var(--h-num); }
.t-str { color: var(--h-str); } .t-com { color: var(--h-com); font-style: italic; } .t-rot { color: var(--h-rot); font-weight: 600; } .t-dir { color: var(--h-dir); }

.teste {
  border-left: 3px solid var(--n2);
  padding: 2px 0 2px 12px;
  margin: 0;
  font-size: 14px;
}
.teste strong { font-weight: 600; }
details { border-top: 1px dashed var(--linha); padding-top: 12px; }
summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--tinta-2); }
details[open] summary { margin-bottom: 10px; }

@media (max-width: 520px) {
  .parte { padding: 16px; }
  .casa.grande { width: 38px; height: 38px; font-size: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  .casa.aberta { transition: background .2s; }
}
</style>
</head>

    <p class="sub">O que falta no <code>src/main.asm</code>, parte por parte, com o código e onde colar. Cada parte entra em cima do código da anterior, então sigam a ordem dos números.</p>

<script>
const REPO = 'rafael-guimaraes/controle';
const PARTES = [{"n": 1, "id": "leitura", "titulo": "Leitura das entradas", "resumo": "Lê a jogada numa linha só (A2, FA2, DA2), confere se é válida e abre a casa. O jogo passa a rodar em loop.", "depende": [], "teste": "Digite C3: a casa abre. C3 de novo, Z9 ou c3: \"Jogada invalida\". Por enquanto F e D também só abrem a casa, e abrir uma bomba mostra * e o jogo continua.", "issue": 1, "edicoes": [{"onde": "No fim do `.data`", "codigo": "pede_jogada:  .asciiz \"\\nJogada: \"\nmsg_invalida: .asciiz \"Jogada invalida\\n\"\nbuffer:       .space 16"}, {"onde": "Troque o `main` inteiro por", "codigo": "main:\n    jal colocar_minas\n\njogo:\n    jal imprimir_tabuleiro\n\n    jal ler_jogada\n    bltz $v0,jogada_invalida\n\n    move $s0,$v0\n    move $s1,$v1\n    lb  $s2,estado($s1)\n\njogada_abrir:\n    bnez $s2,jogada_invalida\n\n    li  $t0,1\n    sb  $t0,estado($s1)\n    j   jogo\n\njogada_invalida:\n    li  $v0,4\n    la  $a0,msg_invalida\n    syscall\n    j   jogo"}, {"onde": "No fim do arquivo (procedimento novo)", "codigo": "ler_jogada:\n    li  $v0,4\n    la  $a0,pede_jogada\n    syscall\n\n    li  $v0,8\n    la  $a0,buffer\n    li  $a1,16\n    syscall\n\n    la  $t0,buffer\n    li  $v0,0\n\n    lb  $t2,2($t0)\n    beq  $t2,'\\n',lj_casa\n\n    lb  $t2,0($t0)\n    addi $t0,$t0,1\n\n    li  $v0,1\n    beq  $t2,'F',lj_casa\n\n    li  $v0,2\n    beq  $t2,'D',lj_casa\n\n    j   lj_invalida\n\nlj_casa:\n    lb  $t4,0($t0)\n    lb  $t5,1($t0)\n    lb  $t6,2($t0)\n\n    bne  $t6,'\\n',lj_invalida\n    blt  $t4,'A',lj_invalida\n    bgt  $t4,'P',lj_invalida\n    blt  $t5,'1',lj_invalida\n    bgt  $t5,'8',lj_invalida\n\n    addi $t4,$t4,-65\n    addi $t5,$t5,-49\n    sll  $v1,$t5,4\n    add  $v1,$v1,$t4\n    jr  $ra\n\nlj_invalida:\n    li  $v0,-1\n    jr  $ra"}], "arquivo": ".data\nmapa:       .byte 0:128             # negativo = bomba; 0 a 8 = bombas em volta\nestado:     .byte 0:128             # 0 = fechada; 1 = aberta\ncabecalho:  .asciiz \"\\n  A B C D E F G H I J K L M N O P\\n\"\npede_jogada:  .asciiz \"\\nJogada: \"\nmsg_invalida: .asciiz \"Jogada invalida\\n\"\nbuffer:       .space 16\n\n.text\n.globl main\n\nmain:\n    jal colocar_minas\n\njogo:\n    jal imprimir_tabuleiro\n\n    jal ler_jogada\n    bltz $v0,jogada_invalida\n\n    move $s0,$v0\n    move $s1,$v1\n    lb  $s2,estado($s1)\n\njogada_abrir:\n    bnez $s2,jogada_invalida\n\n    li  $t0,1\n    sb  $t0,estado($s1)\n    j   jogo\n\njogada_invalida:\n    li  $v0,4\n    la  $a0,msg_invalida\n    syscall\n    j   jogo\n\nimprimir_tabuleiro:\n    li  $v0,4\n    la  $a0,cabecalho\n    syscall\n\n    li  $t0,0\n    li  $t2,0\n\nit_linha:\n    li  $v0,1\n    addi $a0,$t0,1\n    syscall\n\n    li  $v0,11\n    li  $a0,' '\n    syscall\n\n    li  $t1,0\n\nit_coluna:\n    lb  $t3,estado($t2)\n\n    li  $a0,'#'\n    beqz $t3,it_imprime\n\n    lb  $t3,mapa($t2)\n\n    li  $a0,'*'\n    bltz $t3,it_imprime\n\n    li  $a0,'.'\n    beqz $t3,it_imprime\n\n    addi $a0,$t3,'0'\n\nit_imprime:\n    li  $v0,11\n    syscall\n\n    li  $v0,11\n    li  $a0,' '\n    syscall\n\n    addi $t2,$t2,1\n    addi $t1,$t1,1\n    blt  $t1,16,it_coluna\n\n    li  $v0,11\n    li  $a0,'\\n'\n    syscall\n\n    addi $t0,$t0,1\n    blt  $t0,8,it_linha\n\n    jr  $ra\n\ncolocar_minas:\n    li  $t1,0\n\ncm_sortear:\n    li  $v0,42\n    li  $a0,0\n    li  $a1,128\n    syscall\n    move $t3,$a0\n\n    lb  $t4,mapa($t3)\n    bltz $t4,cm_sortear\n\n    li  $t4,-9\n    sb  $t4,mapa($t3)\n\n    srl  $t5,$t3,4\n    andi $t6,$t3,15\n\n    li  $t7,-1\n\ncm_linha:\n    li  $t8,-1\n\ncm_coluna:\n    add  $t9,$t5,$t7\n    bltz $t9,cm_pular\n    bge  $t9,8,cm_pular\n\n    add  $t2,$t6,$t8\n    bltz $t2,cm_pular\n    bge  $t2,16,cm_pular\n\n    sll  $t4,$t9,4\n    add  $t4,$t4,$t2\n    lb   $t2,mapa($t4)\n    addi $t2,$t2,1\n    sb   $t2,mapa($t4)\n\ncm_pular:\n    addi $t8,$t8,1\n    ble  $t8,1,cm_coluna\n\n    addi $t7,$t7,1\n    ble  $t7,1,cm_linha\n\n    addi $t1,$t1,1\n    blt  $t1,20,cm_sortear\n\n    jr  $ra\n\nle const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function realcarLinha(linha) {
  const m = linha.match(/^(\s*)([A-Za-z_]\w*:)?(\s*)(\.?[a-z]+\b)?/);
  let saida = '', resto = linha;
  if (m && m[0]) {
    saida += m[1];
    if (m[2]) saida += '<span class="t-rot">' + esc(m[2]) + '</span>';
    saida += m[3];
    if (m[4]) saida += '<span class="' + (m[4][0] === '.' ? 't-dir' : 't-mnem') + '">' + m[4] + '</span>';
    resto = linha.slice(m[0].length);
  }
  const re = /("(?:\\.|[^"\\])*")|('(?:\\.|[^'\\])')|(#.*$)|(\$\w+)|(\.[a-z]+)|(-?\b\d+\b)/g;
  let ultimo = 0, x;
  while ((x = re.exec(resto))) {
    saida += esc(resto.slice(ultimo, x.index));
    const cls = x[1] || x[2] ? 't-str' : x[3] ? 't-com' : x[4] ? 't-reg' : x[5] ? 't-dir' : 't-num';
    saida += '<span class="' + cls + '">' + esc(x[0]) + '</span>';
    ultimo = re.lastIndex;
  }
  return saida + esc(resto.slice(ultimo));
}
const realcar = codigo => codigo.split('\n').map(realcarLinha).join('\n');
const comCodigo = texto => esc(texto).replace(/`([^`]+)`/g, '<code>$1</code>');

function bloco(codigo, id) {
  return '<div class="bloco"><pre id="' + id + '"><code>' + realcar(codigo) + '</code></pre>' +
    '<button class="copiar" type="button" data-alvo="' + id + '">Copiar</button></div>';
}

function desenhar() {
  const nomes = Object.fromEntries(PARTES.map(p => [p.id, p]));
  document.getElementById('partes').innerHTML = PARTES.map(p => `
    <section class="parte" id="${p.id}">
      <div class="parte-topo">
        <span class="casa grande" data-n="${p.n}">${p.n}</span>
        <h2>${esc(p.titulo)}</h2>
        <span class="selo livre" data-selo="${p.id}">Livre</span>
      </div>
      <p class="resumo">${comCodigo(p.resumo)}</p>
      <div class="linha-meta">
        ${p.depende.length ? `<span class="deps">Depende de ${p.depende.map(d =>
          `<a class="casa" data-n="${nomes[d].n}" data-dep="${d}" href="#${d}" title="${esc(nomes[d].titulo)}">${nomes[d].n}</a>`).join('')}</span>` : '<span>Pode começar agora</span>'}
        ${p.issue ? `<a class="issue-link" href="https://github.com/${REPO}/issues/${p.issue}" target="_blank" rel="noopener">Issue #${p.issue}</a>` : ''}
        <span data-quem="${p.id}"></span>
      </div>
      ${p.edicoes.map((e, i) => `
        <div class="edicao">
          <div class="onde">${comCodigo(e.onde)}</div>
          ${bloco(e.codigo, p.id + '-' + i)}
        </div>`).join('')}
      <p class="teste"><strong>Como testar:</strong> ${comCodigo(p.teste)}</p>
      <details>
        <summary>Arquivo completo depois desta parte</summary>
        ${bloco(p.arquivo, p.id + '-arquivo')}
      </details>
    </section>`).join('');

  document.getElementById('tabuleiro').innerHTML = PARTES.map(p =>
    `<a class="casa" data-n="${p.n}" data-casa="${p.id}" href="#${p.id}" title="${esc(p.titulo)}">${p.n}</a>`
  ).join('') + '<span class="contagem" id="contagem"></span>';
}

document.addEventListener('click', async ev => {
  const btn = ev.target.closest('.copiar');
  if (!btn) return;
  const texto = document.getElementById(btn.dataset.alvo).innerText;
  try {
    await navigator.clipboard.writeText(texto);
    btn.textContent = 'Copiado';
  } catch {
    const r = document.createRange();
    r.selectNodeContents(document.getElementById(btn.dataset.alvo));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = 'Selecionado';
  }
  setTimeout(() => (btn.textContent = 'Copiar'), 1500);
});

function situacao(issue) {
  if (!issue) return { classe: 'livre', texto: 'Livre', quem: '' };
  const r = issue.reactions || {};
  const quem = (issue.assignees || []).map(a => a.login).join(', ');
  if (issue.state === 'closed' || r.rocket > 0) return { classe: 'feita', texto: 'Feita', quem };
  if (quem || r.eyes > 0) return { classe: 'andamento', texto: 'Em andamento', quem };
  return { classe: 'livre', texto: 'Livre', quem: '' };
}

function aplicar(issues) {
  const porNumero = Object.fromEntries(issues.map(i => [i.number, i]));
  let feitas = 0;
  const estado = {};
  for (const p of PARTES) {
    const s = situacao(porNumero[p.issue]);
    estado[p.id] = s;
    if (s.classe === 'feita') feitas++;
    const selo = document.querySelector(`[data-selo="${p.id}"]`);
    selo.className = 'selo ' + s.classe;
    selo.textContent = s.texto;
    document.querySelector(`[data-quem="${p.id}"]`).textContent = s.quem ? 'Com ' + s.quem : '';
  }
  document.querySelectorAll('[data-casa], [data-dep]').forEach(el => {
    const id = el.dataset.casa || el.dataset.dep;
    el.classList.toggle('aberta', estado[id].classe === 'feita');
  });
  document.getElementById('contagem').textContent = `${feitas} de ${PARTES.length} feitas`;
}

async function carregar() {
  const chave = 'controle-issues';
  try {
    const resp = await fetch(`https://api.github.com/repos/${REPO}/issues?state=all&per_page=100`, {
      headers: { Accept: 'application/vnd.github+json' }
    });
    if (!resp.ok) throw new Error(resp.status);
    const issues = await resp.json();
    try { localStorage.setItem(chave, JSON.stringify(issues)); } catch {}
    aplicar(issues);
  } catch {
    let guardadas = null;
    try { guardadas = JSON.parse(localStorage.getItem(chave)); } catch {}
    const aviso = document.getElementById('erro-status');
    aviso.hidden = false;
    aviso.innerHTML = guardadas
      ? `O GitHub não respondeu agora; o status mostrado é o da sua última visita. <a href="https://github.com/${REPO}/issues?q=is%3Aissue" target="_blank" rel="noopener">Ver as issues</a>.`
      : `O GitHub não respondeu agora, então o status não aparece. <a href="https://github.com/${REPO}/issues?q=is%3Aissue" target="_blank" rel="noopener">Ver as issues</a>.`;
    aplicar(guardadas || []);
  }
}

desenhar();
carregar();
</script>
