name: status das partes

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  aplicar:
    if: startsWith(github.event.issue.title, 'peguei ') || startsWith(github.event.issue.title, 'terminei ') || startsWith(github.event.issue.title, 'livre ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const aviso = context.payload.issue;
            const quem = aviso.user.login;
            const [acao, num] = aviso.title.trim().split(/\s+/);
            const parte = Number(num);
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            const fecharAviso = async texto => {
              await github.rest.issues.createComment({ ...repo, issue_number: aviso.number, body: texto });
              await github.rest.issues.update({ ...repo, issue_number: aviso.number, state: 'closed', state_reason: 'completed', labels: ['aviso'] });
            };

            if (!(parte >= 1 && parte <= 6)) {
              await fecharAviso('Parte inválida.');
              return;
            }

            const { data: alvo } = await github.rest.issues.get({ ...repo, issue_number: parte });
            const manter = alvo.labels.map(l => l.name).filter(n => n !== 'andamento' && !n.startsWith('com-'));

            if (acao === 'peguei') {
              await github.rest.issues.update({ ...repo, issue_number: parte, state: 'open', labels: [...manter, 'andamento', 'com-' + quem] });
            } else if (acao === 'terminei') {
              await github.rest.issues.update({ ...repo, issue_number: parte, state: 'closed', state_reason: 'completed', labels: [...manter, 'com-' + quem] });
            } else {
              await github.rest.issues.update({ ...repo, issue_number: parte, state: 'open', labels: manter });
            }

            await github.rest.issues.createComment({ ...repo, issue_number: parte, body: `${acao} (por ${quem})` });
            await fecharAviso(`Feito: parte ${parte} marcada como "${acao}".`);
